name: HangDry
options:
  bundleIdPrefix: com.huck
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CURRENT_PROJECT_VERSION: "1"
targets:
  HangDry:
    type: application
    platform: macOS
    sources:
      - path: HangDry
    info:
      path: HangDry/Info.plist
      properties:
        CFBundleDisplayName: HangDry
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 HangDry"
    entitlements:
      path: HangDry/HangDry.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huck.HangDry
        PRODUCT_NAME: HangDry
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
  HangDryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HangDryTests
      # 直接编译 App 源码（不挂宿主 App），测试进程不在沙盒里，可以读写临时目录
      - path: HangDry
        excludes:
          - App/HangDryApp.swift
          - Resources
          - Info.plist
          - HangDry.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huck.HangDryTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  HangDry:
    build:
      targets:
        HangDry: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HangDryTests
